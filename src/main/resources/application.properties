spring.application.name=iso-payment-gateway

server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=jdbc:postgresql://localhost:5432/isobank
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

gateway.bank.host=localhost
gateway.bank.port=9999
gateway.bank.connection-timeout-ms=5000
gateway.bank.read-timeout-ms=30000
gateway.bank.max-retries=3
gateway.bank.retry-delay-ms=1000

gateway.pool.max-total=20
gateway.pool.max-idle=10
gateway.pool.min-idle=2
gateway.pool.max-wait-millis=5000
gateway.pool.test-on-borrow=true
gateway.pool.test-on-return=false
gateway.pool.test-while-idle=true
gateway.pool.time-between-eviction-runs-millis=30000
gateway.pool.min-evictable-idle-time-millis=60000

gateway.ssl.enabled=false
gateway.ssl.keystore-path=gateway-keystore.p12
gateway.ssl.keystore-password=senha123
gateway.ssl.keystore-type=PKCS12
gateway.ssl.truststore-path=gateway-truststore.jks
gateway.ssl.truststore-password=senha123
gateway.ssl.truststore-type=JKS
gateway.ssl.protocol=TLSv1.2

gateway.heartbeat.enabled=true
gateway.heartbeat.interval-ms=30000
gateway.heartbeat.max-consecutive-failures=3

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.data.redis.host=localhost
spring.data.redis.port=6379

gateway.idempotency.ttl-seconds=86400
gateway.idempotency.key-prefix=idempotency:

gateway.security.encryption-key=${ENCRYPTION_KEY:}

gateway.ratelimit.requests-per-second=100
gateway.ratelimit.burst-capacity=150

resilience4j.circuitbreaker.instances.bankConnection.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.bankConnection.slidingWindowSize=10
resilience4j.circuitbreaker.instances.bankConnection.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.bankConnection.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.bankConnection.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.bankConnection.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.bankConnection.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bankConnection.slowCallRateThreshold=80
resilience4j.circuitbreaker.instances.bankConnection.slowCallDurationThreshold=5s

management.tracing.sampling.probability=1.0

logging.level.com.example.isogateway=DEBUG