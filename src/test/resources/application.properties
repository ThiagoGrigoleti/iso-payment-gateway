spring.application.name=iso-payment-gateway-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=localhost
spring.data.redis.port=6379

gateway.idempotency.ttl-seconds=60
gateway.idempotency.key-prefix=test:idempotency:

gateway.bank.host=localhost
gateway.bank.port=9999
gateway.bank.connection-timeout-ms=1000
gateway.bank.read-timeout-ms=5000
gateway.bank.max-retries=1
gateway.bank.retry-delay-ms=100

gateway.pool.max-total=5
gateway.pool.max-idle=2
gateway.pool.min-idle=0
gateway.pool.max-wait-millis=1000

logging.level.com.example.isogateway=WARN
